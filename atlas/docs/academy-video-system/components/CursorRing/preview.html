<!-- @dsCard group="Teaching" width=1920 height=1080 subtitle="Focus zoom into the crop, one ring at the click" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
html,body{margin:0;background:var(--navy)}
.frame{position:relative;width:1920px;height:1080px;background:var(--navy);font-family:var(--font-sans);color:var(--paper);overflow:hidden}
.crop{position:absolute;inset:var(--safe-16-9);transform-origin:62% 48%;animation:zoom var(--focus-zoom) var(--settle) .2s both}
.panel{position:absolute;left:0;top:0;width:100%;height:100%;background:var(--navy-raised);border:2px solid var(--navy-line);border-radius:var(--radius-card);box-sizing:border-box;padding:var(--step-4)}
.row{display:flex;align-items:center;gap:var(--step-3);margin-bottom:var(--step-3)}
.label{width:360px;color:var(--paper-muted)}
.field{flex:1;height:72px;border:2px solid var(--navy-line);border-radius:var(--radius-chip);display:flex;align-items:center;padding:0 var(--step-2);font-family:var(--font-mono)}
.btn{position:absolute;right:var(--step-4);bottom:var(--step-4);padding:var(--step-2) var(--step-4);background:var(--blue);color:var(--on-blue);border-radius:var(--radius-chip);font-weight:600}
.ring{position:absolute;right:calc(var(--step-4) - 24px);bottom:calc(var(--step-4) - 24px);width:280px;height:120px;border:6px solid var(--blue);border-radius:var(--radius-ring);box-shadow:0 0 0 24px var(--blue-tint);opacity:0;animation:ring 1400ms var(--settle) .9s both}
.cursor{position:absolute;right:120px;bottom:60px;width:48px;height:48px}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.15)}}
@keyframes ring{0%{opacity:0;transform:scale(1.12)}14%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.crop,.ring{animation:none;opacity:1;transform:none}}
</style></head><body>
<div class="frame">
  <div class="crop">
    <div class="panel">
      <div class="row"><span class="label callout">Model</span><span class="field code">claude-sonnet-4-5</span></div>
      <div class="row"><span class="label callout">System prompt</span><span class="field code">You draft replies for review…</span></div>
      <div class="row"><span class="label callout">Input</span><span class="field code">{{ $json.body }}</span></div>
      <div class="btn callout">Execute node</div>
      <div class="ring"></div>
      <svg class="cursor" viewBox="0 0 24 24" fill="var(--paper)" stroke="var(--navy)" stroke-width="1.5"><path d="M4 3l7 17 2.5-6.5L20 11z"/></svg>
    </div>
  </div>
</div>
</body></html>
