<!-- @dsCard group="Opening" width=1920 height=1080 subtitle="0–3 s: the payoff before the branding" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
html,body{margin:0;background:var(--navy)}
.frame{position:relative;width:1920px;height:1080px;background:var(--navy);font-family:var(--font-sans);color:var(--paper);overflow:hidden}
.app{position:absolute;inset:var(--safe-16-9);display:grid;grid-template-columns:1fr 1fr;gap:var(--step-4)}
.pane{background:var(--navy-raised);border:2px solid var(--navy-line);border-radius:var(--radius-card);padding:var(--step-4);box-sizing:border-box}
.pane h3{margin:0 0 var(--step-2);font-weight:500;color:var(--paper-muted)}
.pane p{margin:0 0 var(--step-2)}
.ghost{height:36px;border-radius:var(--radius-chip);background:var(--navy-line);margin-bottom:var(--step-2);opacity:.55}
.ghost.w{width:62%}.ghost.m{width:82%}
.badge{position:absolute;left:var(--safe-16-9);bottom:var(--safe-16-9);display:flex;align-items:center;gap:var(--step-2);background:var(--success);color:var(--on-blue);padding:var(--step-2) var(--step-4);border-radius:var(--radius-ring);
 opacity:0;transform:translateY(16px);animation:rise var(--title-rise) var(--settle) .4s forwards}
.badge svg{width:40px;height:40px}
.scrim{position:absolute;inset:0;background:var(--navy);opacity:0;animation:none}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.badge{animation:none;opacity:1;transform:none}}
</style></head><body>
<div class="frame">
  <div class="app">
    <div class="pane">
      <h3 class="support">Inquiry · support@example.com</h3>
      <p class="callout">“Can I move my plan to annual billing before the 1st?”</p>
      <div class="ghost m"></div><div class="ghost w"></div><div class="ghost"></div>
    </div>
    <div class="pane">
      <h3 class="support">Draft reply · generated by the workflow</h3>
      <p class="callout">Hi Dana, yes — annual billing can start on the 1st. Here is what changes…</p>
      <div class="ghost"></div><div class="ghost m"></div><div class="ghost w"></div>
    </div>
  </div>
  <div class="badge promise">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 7"/></svg>
    Ready for review.
  </div>
</div>
</body></html>
