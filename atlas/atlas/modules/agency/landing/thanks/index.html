<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Request received | Mapfront</title>
<link rel="icon" href="/mapfront-icon.png">
<style>
@font-face {
  font-family: "Archivo"; font-style: normal; font-weight: 100 900; font-stretch: 62% 125%; font-display: swap;
  src: url("/fonts/archivo-var.woff2") format("woff2-variations"), url("/fonts/archivo-var.woff2") format("woff2");
}
* { box-sizing: border-box; margin: 0; }
body {
  min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem;
  background: linear-gradient(180deg, #071a22, #040b12); color: #fff;
  font-family: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  line-height: 1.5;
}
main { max-width: 34rem; }
.word { font-weight: 900; letter-spacing: -0.035em; font-size: 1.4rem; text-transform: lowercase; color: #f4b942; }
h1 { font-stretch: 72%; font-weight: 800; line-height: .98; font-size: clamp(2.4rem, 8vw, 4rem); margin: 1.2rem 0 1rem; }
p { color: rgba(255, 255, 255, 0.82); font-size: 1.1rem; margin-bottom: 1rem; }
a { color: #fff; text-decoration-color: #f4b942; text-decoration-thickness: 2px; text-underline-offset: .2em; }
a.btn {
  display: inline-flex; align-items: center; min-height: 3rem; padding: .8rem 1.4rem; margin-top: .6rem;
  border-radius: 999px; background: #f4b942; color: #0f3d3e; font-weight: 700; text-decoration: none;
}
a:focus-visible { outline: 3px solid #f4b942; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="word">mapfront</p>
  <h1>Got it. Your preview is on the list.</h1>
  <p>Miro will be in touch within a day at the number or address you gave. The preview is free, and nothing is charged unless you decide to launch it.</p>
  <p>Anything to add? Email <a href="mailto:miro@mapfront.io">miro@mapfront.io</a>.</p>
  <a class="btn" href="/">Back to mapfront.io</a>
</main>
</body>
</html>
