<section class="mf-hero mf-hero--beauty" aria-labelledby="hero-title">
  $scene
  <div class="mf-hero__grid">
    <div class="mf-hero__copy">
      <p class="mf-hero__kind">$kicker</p>
      <h1 id="hero-title" class="mf-hero__headline">$lines</h1>
      <p class="mf-hero__sub">$subhead</p>
      <div class="mf-actions">$actions</div>
    </div>
    <div class="mf-mirror-stand">
      <div class="mf-mirror">$photo<span class="mf-mirror__initial" aria-hidden="true">$initial</span></div>
      <p class="mf-mirror__plate" aria-hidden="true">$name</p>
    </div>
  </div>
</section>
