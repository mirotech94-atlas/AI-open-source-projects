<section class="mf-hero mf-hero--food" aria-labelledby="hero-title">
  $scene
  <div class="mf-awning" aria-hidden="true"></div>
  <div class="mf-hero__grid">
    <div class="mf-hero__copy">
      <p class="mf-hero__kind">$kicker</p>
      <p class="mf-hero__sign" aria-hidden="true">$name</p>
      <h1 id="hero-title" class="mf-hero__headline">$lines</h1>
      <p class="mf-hero__sub">$subhead</p>
      <div class="mf-actions">$actions</div>
      <div class="mf-tiles">$tiles</div>
    </div>
    <div class="mf-plate mf-plate--food">$photo</div>
  </div>
</section>
