[project]
name = "atlas"
version = "0.1.0"
description = "Personal operations platform: kernel, modules, agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "asyncpg>=0.30",
  "httpx>=0.28", "anthropic>=0.40", "openai>=1.55", "redis>=5.2",
  "pgvector>=0.3", "python-dateutil>=2.9",
  "jinja2>=3.1", "argon2-cffi>=23.1", "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  # Slack Socket Mode (atlas/channels/slack_socket.py); constraints.txt pins it.
  "websockets>=13",
  # The learning layer (JUDGMENT.md). CPU only, runs in the PRIVATE lane.
  "numpy>=2.0", "scikit-learn>=1.5",
  # ytlearn: keyless YouTube caption reader, imported only when a video is read.
  "youtube-transcript-api>=1.2.5",
  "cryptography>=44",
]

# Not a runtime dependency of the API container, which never opens a browser.
# The Fiverr login helper does, on Miro's Mac, because Fiverr has no API and
# the only honest way in is a session a human established. Kept out of the
# main list so the image does not carry a browser it will never launch.
[project.optional-dependencies]
browser = ["playwright>=1.48"]
# Parallel test runs (docs/test-loop.md); constraints.txt pins the version.
test = ["pytest-xdist>=3.6"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "serial: shares process-wide state, sleeps on wall-clock time or binds a fixed port; under xdist every serial test runs on one worker (tests/conftest.py)",
]
