services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Same reasoning: the database is state, not build input.
      - ${ATLAS_STATE_DIR:-/var/lib/atlas}/pg:/var/lib/postgresql/data
    # Deliberately no ports: section. Postgres is never published.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly no

  # No ollama service (the owner, 2026-10-28: the local model is always qwen3.8
  # on the Spark's vLLM). The api reaches it at LOCAL_LLM_BASE_URL.

  api:
    build: .
    restart: unless-stopped
    # the owner 2026-11-18: keep the Mac responsive. The api may use at most 2 of the cores.
    cpus: 2.0
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    # Loopback only. 2026-10-22: NetBird was removed from this server (the owner);
    # its logout had left the port bound to a vanished wt0 address and the
    # containers resolving through a dead mesh DNS. MESH_BIND is no longer
    # read. Reach the dashboard through Caddy with the device certificate,
    # or `ssh -L 8080:127.0.0.1:8080 root@atlas.example.com`. Never 0.0.0.0.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./logs:/app/logs
      # Browser sessions and hand-dropped exports (LinkedIn analytics CSVs)
      # survive a rebuild. Nothing in here is generated by the image.
      - ./data/app:/app/data

  # WhatsApp linked-device bridge (the owner 2026-11-14; docs/whatsapp-link.md). A dumb
  # transport: only kernel/executor actions call it, and it will only ever message
  # WHATSAPP_OWNER. The API (:8090) is reachable on the compose network only; the
  # pairing page (:8091) is published on the host's loopback and carries no secret.
  # Session credentials live in the named volume atlas_wa_auth, nowhere else.
  wa-bridge:
    build: ./whatsapp-bridge
    restart: unless-stopped
    # Opt-in: a plain `up` never starts it; `up -d wa-bridge` does. It refuses to
    # start without WA_BRIDGE_SECRET and WHATSAPP_OWNER (see index.js).
    profiles: ["wa"]
    environment:
      WA_BRIDGE_SECRET: ${WA_BRIDGE_SECRET:-}
      WHATSAPP_OWNER: ${WHATSAPP_OWNER:-}
      WA_BRIDGE_MAX_PER_HOUR: ${WA_BRIDGE_MAX_PER_HOUR:-20}
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - wa_auth:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # 80 is not optional: it carries the ACME HTTP-01 challenge, and Caddy
    # redirects it to 443 the rest of the time.
    ports: ["80:80", "443:443"]
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
      # Client demos (agency.deploy_demo, /app/data/demos in the api), one
      # explicit Caddy block per hostname. Read-only: Caddy serves files, it never writes them.
      - ./data/app/demos:/srv/demos:ro
    depends_on: [api]

volumes:
  wa_auth:
    name: atlas_wa_auth
