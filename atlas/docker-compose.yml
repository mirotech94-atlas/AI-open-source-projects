services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Same reasoning: the database is state, not build input.
      - ${ATLAS_STATE_DIR:-/var/lib/atlas}/pg:/var/lib/postgresql/data
    # Deliberately no ports: section. Postgres is never published.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly no

  ollama:
    # Pinned, tag and digest (audit #27): `latest` changed under this box on
    # every pull. 0.34.4 is what `latest` pointed to on 2026-09-28; the digest
    # is its multi-arch index, so the tag cannot be moved under us. Upgrade
    # deliberately: new tag, `docker buildx imagetools inspect` for its digest.
    image: ollama/ollama:0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    restart: unless-stopped
    volumes:
      # Outside the build context on purpose. A model is gigabytes, and while
      # it lived under ./data one stale layer cache was enough to bake it into
      # the API image — which is exactly how this box filled its disk.
      - ${ATLAS_STATE_DIR:-/var/lib/atlas}/ollama:/root/.ollama
    environment:
      # The model leaves memory five minutes after its last PRIVATE call
      # rather than sitting resident (the default keeps it loaded, and on
      # 2026-09-25 that was 6.5 GiB of a 9.4 GiB box: chromium then missed
      # its 10 s and the API swapped). A cold load costs a few seconds on
      # the next private question, which is the right trade on this box.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    # Local model for PRIVATE work: personal mail, browser history, embeddings.
    profiles: ["local-llm"]

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    # Bound to the NetBird mesh address. 127.0.0.1 would make the API, the
    # dashboard and the browser-extension ingest unreachable from every other
    # machine on the mesh, which is the entire point of putting them there.
    # MESH_BIND comes from .env; bootstrap/01-netbird.sh writes the wt0 address
    # into it. It falls back to loopback so a misconfigured box fails closed
    # rather than publishing the API on the public interface.
    ports:
      - "${MESH_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - ./logs:/app/logs
      # Browser sessions and hand-dropped exports (LinkedIn analytics CSVs)
      # survive a rebuild. Nothing in here is generated by the image.
      - ./data/app:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # 80 is not optional: it carries the ACME HTTP-01 challenge, and Caddy
    # redirects it to 443 the rest of the time.
    ports: ["80:80", "443:443"]
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
      # Mapfront: published client sites (the api writes them under
      # /app/data/sites, i.e. ./data/app/sites) and the checked-in landing
      # page. Both read-only: Caddy serves files, it never writes them.
      - ./data/app/sites:/srv/sites:ro
      - ./atlas/modules/agency/landing:/srv/landing:ro
    depends_on: [api]
