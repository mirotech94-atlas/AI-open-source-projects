<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Vault">
  <title>Vault</title>
  <!-- The compact Vault mark, for 16-32 px (favicons, the portal top bar,
       the site header). The full mark (vault-mark.svg) adds twelve bolt
       heads and a ticked dial that blur into grey below ~64 px, so this one
       keeps only what survives: the door's rim, its hinges, and the dial. -->
  <circle cx="24" cy="24" r="24" fill="#1257c4"/>
  <rect x="4.6" y="15.6" width="6.4" height="4.6" rx="1.3" fill="#fff"/>
  <rect x="4.6" y="27.8" width="6.4" height="4.6" rx="1.3" fill="#fff"/>
  <circle cx="24" cy="24" r="16.2" fill="#fff"/>
  <circle cx="24" cy="24" r="14.1" fill="#1257c4"/>
  <circle cx="24" cy="24" r="12.7" fill="#fff"/>
  <circle cx="24" cy="24" r="6.4" fill="#1257c4"/>
  <circle cx="24" cy="24" r="2.3" fill="#fff"/>
  <line x1="24" y1="18.9" x2="24" y2="20.4" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
</svg>
