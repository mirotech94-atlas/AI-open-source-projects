# Guardian on :443 — the CUTOVER nginx config. Installed by deploy/cutover.sh,
# which replaces sites-enabled/guardian.conf with this file and disables the
# predecessor's own :443 block. NOT installed by deploy/deploy.sh: until the
# owner says go, :443 belongs to the predecessor and deploy.sh keeps shipping
# deploy/nginx-guardian.conf (:8443 only).
#
# Three server blocks, and every one of them matters:
#
#   :80   — the ACME challenge root and the http→https redirect. The block
#           being replaced owned both. Dropping it would silently break
#           certificate renewal (`/root/.acme.sh` runs from cron four times a
#           day and writes into /var/www/acme) and leave plain-http callers
#           with nothing. This is the single most commonly forgotten half of a
#           cutover like this one.
#   :443  — Guardian, under the SAME certificate the predecessor used
#           (/etc/nginx/certs/my.guarder.io.*), so no cert is reissued or moved.
#   :8443 — kept, unchanged, for one week as the fallback path. Remove this
#           block and `ufw delete allow 8443/tcp` a week after cutover.

# The $connection_upgrade map is NOT declared here. It is http-context and
# nginx allows exactly one declaration per instance, so it lives on its own in
# /etc/nginx/conf.d/guardian-ws-map.conf. This file used to declare it because
# the retired :8443 vhost it was derived from did; keeping both left two maps
# for one variable in the live config. `proxy_set_header Connection
# $connection_upgrade` below still resolves -- conf.d is included before
# sites-enabled.

server {
  listen 80;
  listen [::]:80;
  server_name my.guarder.io;
  # Certificate renewal writes here; it must stay reachable over plain http.
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name my.guarder.io;
  ssl_certificate     /etc/nginx/certs/my.guarder.io.fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/my.guarder.io.key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  client_max_body_size 20m;

  # No `auth_basic`. The block being replaced gated everything behind HTTP
  # basic auth because it had no accounts of its own; Guardian has OTP
  # sign-in, roles and rate limiting, so a second password in front of it
  # would only break the public pages (/status/<slug>, /r/<token>, /act,
  # /hb) that are supposed to work without a session.

  location /api/v1/ws {
    proxy_pass http://127.0.0.1:8800;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # $http_host, not $host: $host drops the port, so behind the pre-cutover
    # :8443 listener the hub would render its own origin as
    # "https://my.guarder.io" -- and `GET /install` embeds that origin in the
    # installer it serves (routers/public.py), so the customer's `curl` would go
    # to a port nothing is listening on. $http_host passes the client's Host
    # through verbatim, port included.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
  }

  # Loopback-only, enforced here because behind the proxy every request
  # reaches the hub from 127.0.0.1 and its own gate cannot tell them apart.
  # See the comment in nginx-guardian.conf: exposing /metrics publicly means
  # editing this block, not just setting GUARDIAN_METRICS_TOKEN.
  location = /metrics {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:8800;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://127.0.0.1:8800;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }
}

server {
  listen 8443 ssl;
  listen [::]:8443 ssl;
  http2 on;
  server_name my.guarder.io;
  ssl_certificate     /etc/nginx/certs/my.guarder.io.fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/my.guarder.io.key.pem;
  client_max_body_size 20m;

  location /api/v1/ws {
    proxy_pass http://127.0.0.1:8800;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
  }

  location = /metrics {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:8800;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://127.0.0.1:8800;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }
}
