# WebSocket upgrade map for the Guardian hub vhosts. http-context, installed to
# /etc/nginx/conf.d/ so it is declared exactly once per nginx instance.
#
# It used to live at the top of nginx-guardian.conf (the :8443 vhost), and
# setup-domain.sh strips the copy out of the :443 block it derives from that
# file for exactly that reason. Retiring :8443 (2026-09-14, once my.guarder.io
# took over :443) took the only declaration with it, so the map moved here --
# guardian-443.conf still says `proxy_set_header Connection $connection_upgrade`
# and nginx -t fails with "unknown variable" without it.
#
# Declare it HERE and nowhere else: two maps for one variable is a hard error.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
